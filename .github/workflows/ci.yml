name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, experiment/qwen35-main-20261004]

jobs:
  smoke-test:
    name: No-key smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 poppler-utils tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download public smoke-test PDFs
        run: python main.py import-data --output-root data --datasets public_docs

      - name: Run smoke test
        env:
          INSURERAG_USE_OLLAMA: "0"
        run: bash scripts/smoke_test.sh

  lint:
    name: Offline CPU tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check imports
        run: |
          python -c "from src.insurerag_vlm.pipeline import DocumentRetrievalPipeline"
          python -c "from src.insurerag_vlm.knowledge import search_knowledge"
          python -c "from src.insurerag_vlm.visual import build_visual_index"
          python -c "from src.insurerag_vlm.benchmark import run_gpu_benchmark"
          echo "All imports OK"

      - name: Run unit tests
        env:
          INSURERAG_VLM_MODEL: local-extractive
          INSURERAG_USE_OLLAMA: "0"
        run: python -m pytest -q
